# ---------- 1. MAIN SOURCE (Indeed) ----------
search_terms:
  - 'stage ("contrôle de gestion" OR "contrôleur de gestion" OR "contrôle budgétaire" OR "business controller")'
  - 'stage ("FP&A" OR "financial planning" OR "planification financière" OR "budget et prévisions")'
  - 'stage ("analyste financier" OR "analyse financière" OR "financial analyst" OR "performance financière")'
  - 'stage ("reporting financier" OR "reporting et KPI" OR "pilotage de la performance")'
  - 'stage ("corporate finance" OR "modélisation financière" OR "financial modelling" OR "évaluation financière")'
  - 'stage ("trésorerie" OR "cash management" OR "working capital")'
  - 'stage finance ("Power BI" OR "VBA" OR "automatisation reporting")'
  - 'stage ("analyste crédit" OR "risques financiers" OR "risques bancaires" OR "audit financier" OR "financement des entreprises")'
  - 'internship ("financial controlling" OR "FP&A" OR "corporate finance" OR "treasury" OR "financial reporting")'

locations:
  - "France"
  - "Paris, France"
  - "Clermont-Ferrand, France"
  - "Lyon, France"
  - "Toulouse, France"
  - "Bordeaux, France"
  - "Lille, France"
  - "Nantes, France"
  - "Marseille, France"

sites:
  - indeed

country_indeed: "france"
results_wanted: 30
hours_old: 72
remote_only: false
delay_seconds: 2

# ---------- 2. EXTRA SOURCES ----------
# Enable ONE at a time (remove the leading "# " on its lines), run, check the log, then the next.
# These use SIMPLE search terms (no OR / quotes), because only Indeed is known to handle operators.
extra_sources:
  - site: linkedin
    search_terms:
      - "stage contrôle de gestion"
      - "stage finance"
      - "stage FP&A"
      - "stage trésorerie"
      - "stage analyste financier"
      - "finance intern"
    locations:
      - "Paris, France"
      - "Lyon, France"
      - "France"
    results_wanted: 20
    delay_seconds: 6
    fetch_description: false   # true = better topic filtering but many more requests (more blocking)

  - site: glassdoor
    search_terms:
       - "stage finance"
       - "stage contrôle de gestion"
       - "finance intern"
    locations:
       - "Paris, France"
       - "Lyon, France"
       - "France"
    results_wanted: 20
    delay_seconds: 4

  - site: google
    search_terms:
       - "stage contrôle de gestion"
       - "stage finance"
       - "stage FP&A"
    locations:
       - "Paris, France"
       - "Lyon, France"
    results_wanted: 20
    delay_seconds: 4

