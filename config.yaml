# ---------- 1. WHAT TO SEARCH ----------
# Each entry is ONE Indeed search. Quotes = exact phrase, OR = any of them.
# (Single-quoted YAML string, double quotes inside are fine.)
search_terms:
  - 'stage ("contrôle de gestion" OR "contrôleur de gestion" OR "contrôle budgétaire" OR "business controller")'
  - 'stage ("FP&A" OR "financial planning" OR "planification financière" OR "budget et prévisions")'
  - 'stage ("analyste financier" OR "analyse financière" OR "financial analyst" OR "performance financière")'
  - 'stage ("reporting financier" OR "reporting et KPI" OR "pilotage de la performance")'
  - 'stage ("corporate finance" OR "modélisation financière" OR "financial modelling" OR "évaluation financière")'
  - 'stage ("trésorerie" OR "cash management" OR "working capital")'
  - 'stage finance ("Power BI" OR "VBA" OR "automatisation reporting")'
  - 'stage ("analyste crédit" OR "risques financiers" OR "risques bancaires" OR "audit financier" OR "financement des entreprises")'
  - 'internship ("financial controlling" OR "FP&A" OR "corporate finance" OR "treasury" OR "financial reporting")'

# ---------- 2. WHERE ----------
locations:
  - "France"
  - "Paris, France"
  - "Clermont-Ferrand, France"
  - "Lyon, France"
  - "Toulouse, France"
  - "Bordeaux, France"
  - "Lille, France"
  - "Nantes, France"
  - "Marseille, France"

sites:
  - indeed

country_indeed: "france"
results_wanted: 30      # per search + location
hours_old: 168           # first run: try 168 to fill the sheet, then go back to 72
remote_only: false
delay_seconds: 2        # pause between searches (reduces blocking)

# ---------- 3. FILTERS APPLIED AFTER SCRAPING ----------
# A) The TITLE must contain at least one of these (whole words only)
include_title_keywords:
  - "stage"
  - "stagiaire"
  - "intern"
  - "internship"
  - "pfe"

# B) Drop the job if the TITLE contains any of these (whole words/phrases)
exclude_title_keywords:
  - "alternance"
  - "apprentissage"
  - "apprenti"
  - "apprentie"
  - "cdi"
  - "cdd"
  - "freelance"
  - "senior"
  - "director"
  - "head of"
  - "stage de 2 mois"
  - "stage de 3 mois"
  - "stage de 4 mois"
  - "stage de 5 mois"
  - "stage de fin d'études 2026"
  - "data scientist"
  - "machine learning engineer"
  - "software engineer"
  - "développeur"
  - "développeuse"
  - "ingénieur logiciel"

# C) TOPIC check: title + start of description must contain at least one of
#    these fragments (plain substring, so "financ" matches financier/finance/financial)
require_any_keywords:
  - "finance"
  - "contrôle de gestion"
  - "controle de gestion"
  - "contrôleur de gestion"
  - "controlling"
  - "controller"
  - "fp&a"
  - "trésorerie"
  - "tresorerie"
  - "treasury"
  - "comptab"
  - "audit"
  - "crédit"
  - "corporate"

worksheet: "Jobs"
