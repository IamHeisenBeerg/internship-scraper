# ---------- 1. MAIN SOURCE (Indeed) ----------
search_terms:
  - 'stage ("contrôle de gestion" OR "contrôleur de gestion" OR "contrôle budgétaire" OR "business controller")'
  - 'stage ("FP&A" OR "financial planning" OR "planification financière" OR "budget et prévisions")'
  - 'stage ("analyste financier" OR "analyse financière" OR "financial analyst" OR "performance financière")'
  - 'stage ("reporting financier" OR "reporting et KPI" OR "pilotage de la performance")'
  - 'stage ("corporate finance" OR "modélisation financière" OR "financial modelling" OR "évaluation financière")'
  - 'stage ("trésorerie" OR "cash management" OR "working capital")'
  - 'stage finance ("Power BI" OR "VBA" OR "automatisation reporting")'
  - 'stage ("analyste crédit" OR "risques financiers" OR "risques bancaires" OR "audit financier" OR "financement des entreprises")'
  - 'internship ("financial controlling" OR "FP&A" OR "corporate finance" OR "treasury" OR "financial reporting")'

locations:
  - "France"
  - "Paris, France"
  - "Clermont-Ferrand, France"
  - "Lyon, France"
  - "Toulouse, France"
  - "Bordeaux, France"
  - "Lille, France"
  - "Nantes, France"
  - "Marseille, France"

sites:
  - indeed

country_indeed: "france"
results_wanted: 30
hours_old: 72
remote_only: false
delay_seconds: 2

# ---------- 2. EXTRA SOURCES ----------
# Enable ONE at a time (remove the leading "# " on its lines), run, check the log, then the next.
# These use SIMPLE search terms (no OR / quotes), because only Indeed is known to handle operators.
extra_sources:
  - site: linkedin
    search_terms:
      - "stage contrôle de gestion"
      - "stage finance"
      - "stage FP&A"
      - "stage trésorerie"
      - "stage analyste financier"
      - "finance intern"
    locations:
      - "Paris, France"
      - "Lyon, France"
      - "France"
    results_wanted: 20
    delay_seconds: 6
    fetch_description: false   # true = better topic filtering but many more requests (more blocking)

  - site: glassdoor
    search_terms:
       - "stage finance"
       - "stage contrôle de gestion"
       - "finance intern"
    locations:
       - "Paris, France"
       - "Lyon, France"
       - "France"
    results_wanted: 20
    delay_seconds: 4

  - site: google
    search_terms:
       - "stage contrôle de gestion"
       - "stage finance"
       - "stage FP&A"
    locations:
       - "Paris, France"
       - "Lyon, France"
    results_wanted: 20
    delay_seconds: 4

# ---------- 3. FILTERS (apply to ALL sources) ----------
include_title_keywords:
  - "stage"
  - "stagiaire"
  - "intern"
  - "internship"
  - "pfe"

exclude_title_keywords:
  - "alternance"
  - "apprentissage"
  - "apprenti"
  - "apprentie"
  - "cdi"
  - "cdd"
  - "freelance"
  - "senior"
  - "director"
  - "head of"
  - "stage de 2 mois"
  - "stage de 3 mois"
  - "stage de 4 mois"
  - "stage de 5 mois"
  - "stage de fin d'études 2026"
  - "data scientist"
  - "machine learning engineer"
  - "software engineer"
  - "développeur"
  - "développeuse"
  - "ingénieur logiciel"

require_any_keywords:
  - "financ"
  - "contrôle de gestion"
  - "controle de gestion"
  - "contrôleur de gestion"
  - "controlling"
  - "controller"
  - "fp&a"
  - "trésorerie"
  - "tresorerie"
  - "treasury"
  - "comptab"
  - "audit"
  - "crédit"
  - "corporate"

worksheet: "Jobs"

# ---------- AI scoring / tailoring / Telegram / sheet (add at the END of config.yaml) ----------
ai:
  enabled: true
  scoring_model: "gemini-3.1-flash-lite"   # free tier, high daily limit
  scoring_rpm: 12                          # stay under the free per-minute cap
  batch_size: 5                            # jobs scored per request (saves quota)
  max_scored_per_run: 150
  output_language: "English"               # language of "Why it fits" / "Watch-outs"

tailoring:
  enabled: true
  model: "gemini-3.5-flash"                # better writing, lower free limits
  min_score: 80                            # only jobs scoring at least this get a tailored CV + letter
  max_per_run: 6
  max_age_days: 7
  rpm: 8

notify:
  enabled: true
  min_score: 75                            # Telegram alert threshold
  max_messages_per_run: 10
  max_age_hours: 72                        # older matches are marked as seen without a message

sheet:
  sort_by_score: true                      # best scores on top after every run
